<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zentwik · 电源管理与场景自动化（vNext 规则引擎版）</title>
<style>
  :root {
    --bg-void: #05070b;
    --bg-surface: #0a0d13;
    --bg-elevated: #111621;
    --bg-glass: rgba(16, 21, 32, 0.92);
    --bg-dock: rgba(13, 17, 25, 0.86);
    --bg-hover: rgba(255, 255, 255, 0.042);
    --bg-row-alt: rgba(255, 255, 255, 0.014);
    --bg-selected: rgba(59, 130, 246, 0.11);

    --hairline: rgba(255, 255, 255, 0.055);
    --hairline-strong: rgba(255, 255, 255, 0.14);

    --ink-1: #eef2f8;
    --ink-2: #9aa6ba;
    --ink-3: #56647a;

    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --accent-glow: rgba(59, 130, 246, 0.25);

    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;

    --row-pad-y: 10px;
    --font-size: 13px;
    --mono: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
  }

  [data-theme="light"] {
    --bg-void: #e9edf4;
    --bg-surface: #f8fafd;
    --bg-elevated: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.94);
    --bg-dock: rgba(248, 250, 253, 0.9);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-row-alt: rgba(15, 23, 42, 0.018);
    --bg-selected: rgba(59, 130, 246, 0.09);
    --hairline: rgba(15, 23, 42, 0.07);
    --hairline-strong: rgba(15, 23, 42, 0.15);
    --ink-1: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg-void); color: var(--ink-1);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: var(--font-size); line-height: 1.4;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: ""; position: fixed; top: -220px; left: 8%; width: 720px; height: 420px;
    background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 72%);
    opacity: 0.28; pointer-events: none; z-index: 0;
  }

  /* Hide native number spinners */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.16); border-radius: 99px; }

  .titlebar {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding-left: 18px; user-select: none; position: relative; z-index: 20;
  }
  .tb-telemetry { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; color: var(--ink-3); }
  .tb-telemetry b { color: var(--ink-2); font-weight: 600; }
  .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.good { background: var(--good); opacity: 0.85; }
  .dot.muted { background: transparent; border: 1.3px solid var(--ink-3); opacity: 0.55; }

  .tb-right { display: flex; align-items: center; height: 100%; }
  .tb-tools { display: flex; height: 100%; margin-right: 4px; }
  .icon-btn, .cap-btn {
    width: 38px; height: 100%; border: none; background: transparent; color: var(--ink-2);
    cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative;
    transition: color .14s, background .14s;
  }
  .cap-btn { width: 44px; }
  .icon-btn:hover, .cap-btn:hover { color: var(--ink-1); background: var(--bg-hover); }
  .cap-btn.close:hover { background: #dc2626; color: #fff; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .cap-btn svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .mini-dot { position: absolute; top: 9px; right: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }

  .shell { height: calc(100vh - 36px); display: flex; position: relative; z-index: 1; }

  .nav-rail {
    width: 162px; min-width: 162px; padding: 8px 10px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: width .2s cubic-bezier(.22,1,.36,1), min-width .2s cubic-bezier(.22,1,.36,1);
  }
  .nav-rail.collapsed { width: 56px; min-width: 56px; padding: 8px 8px 14px; }
  .brand-toggle {
    width: 100%; border: none; background: transparent; color: var(--ink-1);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 14px;
    border-radius: 9px; cursor: pointer; overflow: hidden; transition: background .14s;
  }
  .brand-toggle:hover { background: var(--bg-hover); }
  .brand-toggle svg { width: 22px; height: 22px; flex-shrink: 0; color: var(--accent); filter: drop-shadow(0 0 10px var(--accent-glow)); }
  .brand-name { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .nav-rail.collapsed .brand-toggle { justify-content: center; padding: 8px 0; }
  .nav-rail.collapsed .brand-name, .nav-rail.collapsed .nav-label { display: none; }

  .nav-btn {
    width: 100%; height: 34px; border: none; background: transparent; color: var(--ink-2);
    border-radius: 8px; padding: 0 10px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-size: var(--font-size);
    transition: background .12s, color .12s; margin-bottom: 3px; position: relative;
  }
  .nav-rail.collapsed .nav-btn { justify-content: center; padding: 0; }
  .nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.65; flex-shrink: 0; }
  .nav-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .nav-btn.active { background: rgba(255, 255, 255, 0.04); color: var(--ink-1); font-weight: 600; }
  .nav-btn.active::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2.5px;
    border-radius: 2px; background: var(--accent);
  }
  .nav-btn.active svg { color: var(--accent); }

  .stage {
    flex: 1; min-width: 0; margin: 0 10px 10px 0;
    background: var(--bg-surface); border: 1px solid var(--hairline); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.48);
  }

  .cmd-header {
    padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 100%);
  }
  .cmd-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .cmd-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .plan-pill {
    border: 1px solid var(--hairline-strong); background: rgba(255,255,255,0.03); color: var(--ink-1);
    padding: 4px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: all .14s;
  }
  .plan-pill:hover { border-color: rgba(255,255,255,0.24); background: var(--bg-hover); }
  .dirty-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

  .btn {
    height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--hairline-strong); background: rgba(255,255,255,0.02);
    color: var(--ink-1); cursor: pointer; font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background .12s, border-color .12s, opacity .12s;
  }
  .btn:hover:not(:disabled) { background: var(--bg-hover); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-ghost:hover:not(:disabled) { color: var(--ink-1); background: var(--bg-hover); }
  .btn-sm { height: 24px; padding: 0 9px; font-size: 11.5px; border-radius: 6px; }

  .stage-body { flex: 1; min-height: 0; display: flex; overflow: hidden; position: relative; }
  .main-scroll { flex: 1; min-width: 0; overflow-y: auto; padding: 4px 22px 24px; }

  /* Power Policy Matrix */
  .group-title { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.5px; padding: 14px 14px 6px; }
  .power-head {
    display: grid; grid-template-columns: minmax(220px, 1fr) 160px 160px 100px;
    align-items: center; gap: 12px; padding: 4px 14px 8px; font-size: 11px; font-weight: 600; color: var(--ink-3);
  }
  .power-row {
    display: grid; grid-template-columns: minmax(220px, 1fr) 160px 160px 100px;
    align-items: center; gap: 12px; padding: var(--row-pad-y) 14px; border-radius: 10px; transition: background .12s;
  }
  .power-row:nth-child(even) { background: var(--bg-row-alt); }
  .power-row:hover { background: var(--bg-hover); }
  .policy-name { font-weight: 500; color: var(--ink-1); }
  .policy-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

  .cell-btn {
    display: inline-flex; align-items: center; max-width: 100%;
    padding: 4px 9px; margin-left: -9px; border-radius: 7px;
    border: 1px solid transparent; background: transparent;
    color: var(--ink-2); font-size: 12.5px; cursor: pointer; transition: all .12s;
  }
  .cell-btn:hover { background: rgba(255,255,255,0.06); color: var(--ink-1); border-color: var(--hairline); }
  .status-tag { font-size: 11px; color: var(--ink-3); }
  .status-tag.warn { color: var(--warn); }

  /* Scenarios Stream — Priority Rank + Live Domain Ownership */
  .scene-head {
    display: grid; grid-template-columns: 58px 36px minmax(200px, 1.3fr) minmax(240px, 1.4fr) 88px;
    align-items: center; gap: 12px; padding: 4px 14px 8px;
    font-size: 11px; font-weight: 600; color: var(--ink-3); user-select: none;
  }
  .scene-row {
    display: grid; grid-template-columns: 58px 36px minmax(200px, 1.3fr) minmax(240px, 1.4fr) 88px;
    align-items: center; gap: 12px; padding: 11px 14px;
    border-radius: 11px; cursor: pointer; transition: background .12s;
  }
  .scene-row:nth-child(even) { background: var(--bg-row-alt); }
  .scene-row:hover { background: var(--bg-hover); }
  .scene-row.active { background: var(--bg-selected); }

  /* Priority Rank & Reorder Controls */
  .rank-col { display: flex; align-items: center; gap: 5px; cursor: grab; }
  .rank-col:active { cursor: grabbing; }
  .scene-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); background: var(--accent-soft); }
  .scene-row.dragging { opacity: 0.45; }
  .rank-num {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink-2);
    min-width: 22px;
  }
  .rank-arrows { display: flex; flex-direction: column; gap: 1px; opacity: 0; transition: opacity .12s; }
  .scene-row:hover .rank-arrows, .scene-row.active .rank-arrows { opacity: 1; }
  .arr-btn {
    border: none; background: transparent; color: var(--ink-3); cursor: pointer;
    padding: 0 3px; font-size: 9px; line-height: 1.1; border-radius: 3px;
  }
  .arr-btn:hover:not(:disabled) { color: var(--ink-1); background: rgba(255,255,255,0.08); }
  .arr-btn:disabled { opacity: 0.2; cursor: default; }

  /* Custom Switch (Zero native checkboxes!) */
  .switch {
    width: 32px; height: 18px; border-radius: 999px; border: 1px solid var(--hairline-strong);
    background: rgba(255,255,255,0.06); position: relative; cursor: pointer; transition: all .16s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--ink-2); transition: transform .16s, background .16s;
  }
  .switch.on { background: var(--accent-soft); border-color: var(--accent); }
  .switch.on::after { transform: translateX(14px); background: var(--accent); }

  .if-title { font-weight: 600; color: var(--ink-1); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .if-cond { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count-pill {
    font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 99px;
    background: rgba(255,255,255,0.06); color: var(--ink-2); font-weight: 500;
  }
  .then-grid { display: flex; gap: 14px; flex-wrap: wrap; }
  .then-slot { display: flex; flex-direction: column; gap: 1px; min-width: 82px; }
  .then-k { font-size: 10.5px; color: var(--ink-3); }
  .then-v { font-size: 12px; color: var(--ink-1); }
  .then-v.empty { color: var(--ink-3); }
  .then-v.overridden { color: var(--ink-3); text-decoration: line-through; opacity: 0.6; }

  /* Floating Right Dock */
  .dock {
    width: 396px; min-width: 396px; margin: 2px 14px 14px 0;
    background: var(--bg-dock); backdrop-filter: blur(22px);
    border: 1px solid var(--hairline); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .dock-head { padding: 12px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; }
  .dock-body { flex: 1; overflow-y: auto; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 14px; }

  .field-label { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .clean-input {
    width: 100%; height: 32px; padding: 0 10px; border-radius: 7px;
    background: rgba(0,0,0,0.24); border: 1px solid var(--hairline-strong);
    color: var(--ink-1); font-size: 12.5px; outline: none;
  }
  .clean-input:focus { border-color: var(--accent); }

  /* Custom Glass Select Trigger (Zero native <select>!) */
  .custom-select-btn {
    width: 100%; height: 32px; padding: 0 10px; border-radius: 7px;
    background: rgba(0,0,0,0.24); border: 1px solid var(--hairline-strong);
    color: var(--ink-1); font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    transition: border-color .12s, background .12s;
  }
  .custom-select-btn:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.04); }
  .custom-select-btn span.muted { color: var(--ink-3); }

  .seg-two {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px;
    border-radius: 8px; background: rgba(0,0,0,0.24); border: 1px solid var(--hairline);
  }
  .seg-opt {
    border: none; background: transparent; color: var(--ink-2); padding: 5px 8px; border-radius: 5px;
    cursor: pointer; font-size: 11.5px; font-weight: 500; transition: all .12s;
  }
  .seg-opt.active { background: var(--bg-elevated); color: var(--ink-1); font-weight: 600; }

  .tag-pool {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
    border-radius: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--hairline);
  }
  .exe-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11.5px;
    background: rgba(255,255,255,0.06); color: var(--ink-1); border: 1px solid var(--hairline);
  }
  .exe-tag button { border: none; background: transparent; color: var(--ink-3); cursor: pointer; padding: 0; font-size: 12px; line-height: 1; }
  .exe-tag button:hover { color: var(--bad); }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 11px; border-radius: 8px; background: rgba(255,255,255,0.025);
    border: 1px solid var(--hairline); cursor: pointer;
  }

  /* Custom Popover */
  .popover {
    position: fixed; z-index: 80; min-width: 220px;
    background: var(--bg-glass); backdrop-filter: blur(22px);
    border: 1px solid var(--hairline-strong); border-radius: 11px;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.7);
    padding: 6px; display: flex; flex-direction: column; gap: 2px;
  }
  .pop-head { padding: 5px 9px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .pop-item {
    border: none; background: transparent; color: var(--ink-1); padding: 7px 10px; border-radius: 6px;
    text-align: left; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .pop-item:hover { background: var(--bg-hover); }
  .pop-item.active { color: var(--accent); font-weight: 600; }
  .pop-sep { height: 1px; background: var(--hairline); margin: 4px; }
  .pop-custom-row { display: flex; gap: 6px; padding: 4px 4px 2px; align-items: center; }
  .pop-custom-row input {
    flex: 1; height: 28px; padding: 0 8px; border-radius: 6px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--hairline-strong);
    color: var(--ink-1); font-family: var(--mono); font-size: 12px; outline: none;
  }

  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-glass); backdrop-filter: blur(14px); color: var(--ink-1);
    border: 1px solid var(--hairline-strong); padding: 8px 16px; border-radius: 999px; font-size: 12px; z-index: 95;
  }
</style>
</head>
<body data-theme="dark">

<header class="titlebar">
  <div class="tb-telemetry">
    <span class="dot good"></span>
    <span><b>Ryzen 9 9955HX</b> · 16C/32T · AC · LocalSystem</span>
  </div>
  <div class="tb-right">
    <div class="tb-tools">
      <button class="icon-btn" title="场景自动化" onclick="switchPage('scenarios')">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
      <button class="icon-btn" title="StateLedger 状态账本" onclick="openLedgerFlyout(event)">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        <span class="mini-dot"></span>
      </button>
      <button class="icon-btn" title="切换深浅色" onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='dark'?'light':'dark')">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
      </button>
    </div>
    <button class="cap-btn"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
    <button class="cap-btn"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
    <button class="cap-btn close"><svg viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
  </div>
</header>

<div class="shell">
  <aside class="nav-rail" id="navRail">
    <div>
      <button class="brand-toggle" title="点击展开 / 收起导航" onclick="document.getElementById('navRail').classList.toggle('collapsed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/>
          <polyline points="8 10 15 10 9 15 16 15"/>
        </svg>
        <span class="brand-name">Zentwik</span>
      </button>

      <button class="nav-btn" onclick="toast('首页总览')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span class="nav-label">首页总览</span></button>

<div class="popover hidden" id="popover"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(msg) {
  const el = $("toastEl"); el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(window._t); window._t = setTimeout(() => el.classList.add("hidden"), 2400);
}
function closePop() { $("popover").classList.add("hidden"); }
document.addEventListener("click", (e) => {
  if (!e.target.closest("#popover") && !e.target.closest(".cell-btn") && !e.target.closest(".plan-pill") && !e.target.closest(".icon-btn") && !e.target.closest(".custom-select-btn") && !e.target.closest("#pickRunningBtn")) closePop();
});

function showPopover(x, y, html) {
  const pop = $("popover");
  pop.innerHTML = html;
  pop.classList.remove("hidden");
  const rect = pop.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(x, window.innerWidth - rect.width - 14)) + "px";
  pop.style.top = Math.max(12, Math.min(y, window.innerHeight - rect.height - 14)) + "px";
}

function openCustomSelect(e, title, options, currentVal, onPick) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  window._selCb = onPick;
  let html = `<div class="pop-head">${title}</div>`;
  options.forEach(opt => {
    const val = typeof opt === "string" ? opt : opt.value;
    const lbl = typeof opt === "string" ? opt : opt.label;
    html += `<button class="pop-item ${val === currentVal ? "active" : ""}" onclick="window._selCb('${val}'); closePop()"><span>${lbl}</span>${val === currentVal ? "<span>✓</span>" : ""}</button>`;
  });
  showPopover(rect.left, rect.bottom + 6, html);
  $("popover").style.minWidth = Math.max(200, rect.width) + "px";
}

let activePage = "scenarios";

// Power Data
const powerPlans = ["性能插电", "移动静音"];
let currentPowerPlan = powerPlans[0];
const winSchemes = ["高性能", "平衡", "卓越性能"];
let currentWinScheme = winSchemes[0];
let powerDirty = false;

const policyGroups = [

      { id: "maxState", name: "最大处理器状态", sub: "Maximum processor state (0–100%)", ac: "100%", dc: "85%", opts: ["50%", "75%", "85%", "99%", "100%"], numeric: true, unit: "%", min: 1, max: 100, status: "已同步" },
      { id: "parking", name: "核心停泊最小可用", sub: "Core parking min cores (0–100%)", ac: "100%", dc: "50%", opts: ["0%", "25%", "50%", "100%"], numeric: true, unit: "%", min: 0, max: 100, status: "已同步" },

    ]

    items: [
      { id: "aspm", name: "PCIe 链路电源管理", sub: "Link State Power Management", ac: "关闭", dc: "最大省电", opts: ["关闭", "中等省电", "最大省电"], numeric: false, status: "部分跳过" },
      { id: "ahci", name: "AHCI 链路电源管理", sub: "HIPM / DIPM", ac: "Active", dc: "HIPM+DIPM", opts: ["Active", "HIPM", "HIPM+DIPM", "Lowest"], numeric: false, status: "已同步" },
      { id: "usb", name: "USB 选择性暂停", sub: "USB selective suspend", ac: "已禁用", dc: "已启用", opts: ["已禁用", "已启用"], numeric: false, status: "已同步" }
    ]
  }
];

// Scenarios Data — Priority-ordered + Per-Domain Arbitration + Future Triggers
let autoSwitchEnabled = true;
let conflictMode = "按域独立 · 高优先级胜出";
const runningSample = ["Cyberpunk2077.exe", "cs2.exe", "eldenring.exe", "Code.exe", "Resolve.exe", "chrome.exe", "obs64.exe", "figma.exe"];

const triggerCats = ["进程集合", "电源状态", "温度 / 功耗", "空闲 / 锁屏", "时间窗"];
const tuningOpts = ["保持原样", "游戏降压 -30", "全核高频", "静音低功耗", "85°C 温控墙"];
const schedOpts = ["保持原样", "游戏 CCD0 隔离", "静音创作"];
const powerOpts = ["保持原样", "性能插电", "移动静音"];

const scenarios = [
  {
    id: "s1", enabled: true, hit: true, name: "高温保护",
    triggerCat: "温度 / 功耗", matchMode: "threshold",
    targets: ["Tctl ≥ 90°C"], dirPrefix: "", powerCond: "不限电源",
    tuning: "85°C 温控墙", sched: "保持原样", power: "保持原样", exitRestore: true
  },
  {
    id: "s2", enabled: true, hit: true, name: "大型游戏",
    triggerCat: "进程集合", matchMode: "exeList",
    targets: ["Cyberpunk2077.exe", "cs2.exe", "eldenring.exe", "helldivers2.exe", "Wuthering Waves.exe"],
    dirPrefix: "E:\\Games\\", powerCond: "仅限插电 (AC)",
    tuning: "游戏降压 -30", sched: "游戏 CCD0 隔离", power: "性能插电", exitRestore: true
  },
  {

    triggerCat: "进程集合", matchMode: "exeList",
    targets: ["Resolve.exe", "Premiere.exe", "Code.exe", "rider64.exe"],

  },
  {
    id: "s4", enabled: true, hit: false, name: "离线续航",
    triggerCat: "电源状态", matchMode: "power",
    targets: ["切换至直流电池 (DC)"], dirPrefix: "", powerCond: "不限电源",
    tuning: "静音低功耗", sched: "保持原样", power: "移动静音", exitRestore: true
  }
];
let selectedSceneId = "s2";

function switchPage(page) {
  activePage = page;
  $("navPower").classList.toggle("active", page === "power");
  $("navScenarios").classList.toggle("active", page === "scenarios");
  renderPage();
}
function renderPage() { if (activePage === "power") renderPowerPage(); else renderScenariosPage(); }

// --- Power Page ---
function renderPowerPage() {
  const c = $("stageContainer");
  c.innerHTML = `
    <header class="cmd-header">
      <div class="cmd-left">
        <span class="page-title">电源管理</span>
        <button class="plan-pill" onclick="openPowerPlanMenu(event)">
          <span>${currentPowerPlan}</span>
          <span class="dirty-dot ${powerDirty ? "" : "hidden"}"></span>
          <span style="color:var(--ink-3)">▾</span>
        </button>
        <button class="plan-pill" onclick="openWinSchemeMenu(event)">
          <span style="color:var(--ink-3)">系统计划</span>
          <span>${currentWinScheme}</span>
          <span style="color:var(--ink-3)">▾</span>
        </button>
      </div>
      <div class="cmd-right">
        <button class="btn btn-ghost" onclick="powerDirty=false; renderPowerPage(); toast('已从系统回读')">回读</button>
        <button class="btn btn-primary" ${powerDirty ? "" : "disabled"} onclick="powerDirty=false; renderPowerPage(); toast('已保存至「${currentPowerPlan}」并写入系统')">保存并应用</button>
      </div>
    </header>
    <div class="stage-body">
      <main class="main-scroll" id="powerScroll">
        <div class="power-head">
          <div>策略项</div><div>插电 (AC)</div><div>电池 (DC)</div><div>状态</div>
        </div>
      </main>
    </div>
  `;

  const scroll = $("powerScroll");
  policyGroups.forEach(g => {
    const gt = document.createElement("div"); gt.className = "group-title"; gt.textContent = g.title; scroll.appendChild(gt);
    g.items.forEach(it => {
      const row = document.createElement("div"); row.className = "power-row";
      const isWarn = it.status !== "已同步";
      row.innerHTML = `
        <div><div class="policy-name">${it.name}</div><div class="policy-sub">${it.sub}</div></div>
        <div><button class="cell-btn" onclick="openPolicyOpt(event, '${it.id}', 'ac')">${it.ac}</button></div>
        <div><button class="cell-btn" onclick="openPolicyOpt(event, '${it.id}', 'dc')">${it.dc}</button></div>
        <div class="status-tag ${isWarn ? "warn" : ""}">${it.status}</div>
      `;
      scroll.appendChild(row);
    });
  });
}

function openPolicyOpt(e, id, mode) {
  e.stopPropagation();
  let item; policyGroups.forEach(g => { const f = g.items.find(x => x.id === id); if (f) item = f; });
  const rect = e.currentTarget.getBoundingClientRect();
  let html = `<div class="pop-head">${item.name} · ${mode.toUpperCase()}</div>`;
  item.opts.forEach(o => {
    html += `<button class="pop-item ${item[mode] === o ? "active" : ""}" onclick="setPolicyVal('${id}','${mode}','${o}')">${o}</button>`;
  });
  if (item.numeric) {
    const rawNum = parseInt(item[mode], 10) || 0;
    html += `<div class="pop-sep"></div>
      <div class="pop-head">自定义数值 (${item.min}–${item.max}${item.unit})</div>
      <div class="pop-custom-row">
        <input id="customNumIn" type="number" min="${item.min}" max="${item.max}" value="${rawNum}" onkeydown="if(event.key==='Enter') applyCustomNum('${id}','${mode}',${item.min},${item.max},'${item.unit}')" />
        <button class="btn btn-sm btn-primary" onclick="applyCustomNum('${id}','${mode}',${item.min},${item.max},'${item.unit}')">确定</button>
      </div>`;
  }
  showPopover(rect.left, rect.bottom + 6, html);
  if (item.numeric) setTimeout(() => $("customNumIn")?.focus(), 20);
}
function applyCustomNum(id, mode, min, max, unit) {
  const v = parseInt($("customNumIn").value, 10);
  if (isNaN(v) || v < min || v > max) { toast(`请输入 ${min} 到 ${max} 之间的整数`); return; }
  setPolicyVal(id, mode, `${v}${unit}`);
}
function setPolicyVal(id, mode, val) {
  policyGroups.forEach(g => { const f = g.items.find(x => x.id === id); if (f) f[mode] = val; });
  powerDirty = true; closePop(); renderPowerPage();
}
function openPowerPlanMenu(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  let html = `<div class="pop-head">电源方案</div>`;
  powerPlans.forEach(p => html += `<button class="pop-item ${p===currentPowerPlan?"active":""}" onclick="currentPowerPlan='${p}'; powerDirty=false; closePop(); renderPowerPage()">${p}</button>`);
  html += `<div class="pop-sep"></div><button class="pop-item" onclick="closePop(); toast('另存为新电源方案')">另存为新方案</button>`;
  showPopover(rect.left, rect.bottom + 6, html);
}
function openWinSchemeMenu(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  let html = `<div class="pop-head">Windows 系统电源计划</div>`;
  winSchemes.forEach(s => html += `<button class="pop-item ${s===currentWinScheme?"active":""}" onclick="currentWinScheme='${s}'; closePop(); renderPowerPage()">${s}</button>`);
  html += `<div class="pop-sep"></div><button class="pop-item" onclick="closePop(); toast('复制新建系统计划')">+ 复制新建系统计划</button>`;
  showPopover(rect.left, rect.bottom + 6, html);
}

// --- Scenarios Page (Priority Rank + Per-Domain Arbitration + Zero Native Controls) ---
function computeDomainWinners() {
  const winners = { tuning: null, sched: null, power: null };
  scenarios.forEach(s => {
    if (!s.enabled || !s.hit) return;
    if (s.tuning !== "保持原样" && !winners.tuning) winners.tuning = s.id;
    if (s.sched !== "保持原样" && !winners.sched) winners.sched = s.id;
    if (s.power !== "保持原样" && !winners.power) winners.power = s.id;
  });
  return winners;
}

function formatTriggerSummary(s) {
  if (s.triggerCat === "进程集合") {
    if (s.matchMode === "dirPrefix") return `目录匹配：${s.dirPrefix || "未设置"}`;
    if (s.targets.length === 0) return "未添加目标进程";
    const head = s.targets.slice(0, 2).join(", ");
    const rest = s.targets.length > 2 ? ` 等 ${s.targets.length} 项` : "";
    return `${head}${rest}${s.powerCond !== "不限电源" ? ` · ${s.powerCond}` : ""}`;
  }
  return s.targets[0] || "";
}

function renderScenariosPage() {
  const c = $("stageContainer");
  const cur = scenarios.find(s => s.id === selectedSceneId) || scenarios[0];
  const winners = computeDomainWinners();

  c.innerHTML = `
    <header class="cmd-header">
      <div class="cmd-left">
        <span class="page-title">场景自动化</span>
        <button class="plan-pill" onclick="autoSwitchEnabled=!autoSwitchEnabled; renderScenariosPage()">
          <span class="dot ${autoSwitchEnabled ? "good" : "muted"}"></span>
          <span>${autoSwitchEnabled ? "自动切换：已启用" : "自动切换：已暂停"}</span>
        </button>
        <button class="plan-pill" onclick="openConflictPop(event)">
          <span style="color:var(--ink-3)">仲裁</span>
          <span>${conflictMode}</span>
          <span style="color:var(--ink-3)">▾</span>
        </button>
      </div>
      <div class="cmd-right">
        <button class="btn btn-primary" onclick="addScene()">+ 新建规则</button>
      </div>
    </header>
    <div class="stage-body">
      <main class="main-scroll">
        <div class="scene-head">
          <div>优先级</div><div>启用</div><div>触发规则</div><div>执行动作（按域仲裁）</div><div style="text-align:right">退出恢复</div>
        </div>
        <div id="sceneList"></div>
      </main>
      <aside class="dock">
        <div class="dock-head">
          <span style="font-weight:600;font-size:13px">#${scenarios.indexOf(cur)+1} · ${cur.name}</span>
          <div style="display:flex;gap:4px">
            <button class="btn btn-ghost btn-sm" onclick="toggleHit('${cur.id}')">${cur.hit ? "模拟离开" : "模拟命中"}</button>
            <button class="btn btn-ghost btn-sm" onclick="deleteScene('${cur.id}')">删除</button>
          </div>
        </div>
        <div class="dock-body" id="sceneEditorBody"></div>
      </aside>
    </div>
  `;

  const list = $("sceneList");
  scenarios.forEach((s, idx) => {
    const row = document.createElement("div");
    row.className = `scene-row ${s.id === selectedSceneId ? "active" : ""}`;
    row.draggable = true;
    row.ondragstart = (e) => { window._dragIdx = idx; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    row.ondragend = () => { row.classList.remove("dragging"); document.querySelectorAll(".scene-row").forEach(r => r.classList.remove("drag-over")); };
    row.ondragover = (e) => { e.preventDefault(); row.classList.add("drag-over"); };
    row.ondragleave = () => { row.classList.remove("drag-over"); };
    row.ondrop = (e) => {
      e.preventDefault();
      row.classList.remove("drag-over");
      const from = window._dragIdx;
      if (typeof from === "number" && from !== idx) {
        const [moved] = scenarios.splice(from, 1);
        scenarios.splice(idx, 0, moved);
        renderScenariosPage();
      }
    };
    row.onclick = (e) => { if (e.target.closest(".switch") || e.target.closest(".arr-btn")) return; selectedSceneId = s.id; renderScenariosPage(); };

    const badge = (s.triggerCat === "进程集合" && s.matchMode === "exeList" && s.targets.length > 1)
      ? `<span class="count-pill">${s.targets.length}</span>` : "";
    const hitDot = s.enabled && s.hit ? `<span class="dot good" title="当前命中生效"></span>` : "";

    const tOver = s.enabled && s.hit && s.tuning !== "保持原样" && winners.tuning && winners.tuning !== s.id;
    const sOver = s.enabled && s.hit && s.sched !== "保持原样" && winners.sched && winners.sched !== s.id;
    const pOver = s.enabled && s.hit && s.power !== "保持原样" && winners.power && winners.power !== s.id;

    row.innerHTML = `
      <div class="rank-col">
        <span class="rank-num" title="拖拽上下排序">#${idx + 1}</span>
        <div class="rank-arrows">
          <button class="arr-btn" title="提高优先级" ${idx===0?"disabled":""} onclick="moveScene(${idx}, -1)">▲</button>
          <button class="arr-btn" title="降低优先级" ${idx===scenarios.length-1?"disabled":""} onclick="moveScene(${idx}, 1)">▼</button>
        </div>
      </div>
      <div><button class="switch ${s.enabled ? "on" : ""}" onclick="sToggle('${s.id}')"></button></div>
      <div style="min-width:0">
        <div class="if-title"><span>${s.name}</span>${hitDot}${badge}</div>
        <div class="if-cond" title="${s.targets.join(", ")}">${formatTriggerSummary(s)}</div>
      </div>
      <div class="then-grid">
        <div class="then-slot"><span class="then-k">调校</span><span class="then-v ${s.tuning==="保持原样"?"empty":""} ${tOver?"overridden":""}">${s.tuning}</span></div>
        <div class="then-slot"><span class="then-k">调度</span><span class="then-v ${s.sched==="保持原样"?"empty":""} ${sOver?"overridden":""}">${s.sched}</span></div>
        <div class="then-slot"><span class="then-k">电源</span><span class="then-v ${s.power==="保持原样"?"empty":""} ${pOver?"overridden":""}">${s.power}</span></div>
      </div>
      <div style="text-align:right;font-size:11.5px;color:${s.exitRestore?"var(--ink-2)":"var(--ink-3)"}">${s.exitRestore ? "自动恢复" : "单向"}</div>
    `;
    list.appendChild(row);
  });

  renderSceneEditor(cur, scenarios.indexOf(cur));
}

function renderSceneEditor(cur, idx) {
  const ed = $("sceneEditorBody");
  let triggerBlock = "";
  if (cur.triggerCat === "进程集合") {
    const isDir = cur.matchMode === "dirPrefix";
    triggerBlock = `
      <div class="seg-two" style="margin-bottom:8px">
        <button class="seg-opt ${!isDir?"active":""}" onclick="updateScene('${cur.id}','matchMode','exeList')">多个进程名</button>
        <button class="seg-opt ${isDir?"active":""}" onclick="updateScene('${cur.id}','matchMode','dirPrefix')">目录路径前缀</button>
      </div>
      ${isDir ? `
        <input class="clean-input" placeholder="例如 E:\\Games\\" value="${cur.dirPrefix}" oninput="updateScene('${cur.id}','dirPrefix',this.value,true)" />
      ` : `
        <div class="tag-pool">
          ${cur.targets.map((t, i) => `<span class="exe-tag">${t}<button onclick="removeExe('${cur.id}',${i})">×</button></span>`).join("")}
          ${cur.targets.length === 0 ? `<span style="font-size:11.5px;color:var(--ink-3)">暂无目标进程</span>` : ""}
        </div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <input class="clean-input" id="newExeInput" placeholder="输入进程名回车添加…" onkeydown="if(event.key==='Enter') addExe('${cur.id}')" />
          <button class="btn btn-sm" id="pickRunningBtn" style="height:32px;padding:0 10px" onclick="openRunningPicker(event,'${cur.id}')">从运行中选</button>
        </div>
      `}
      <div style="margin-top:10px">
        <div class="field-label">附加前提条件（AND）</div>
        <button class="custom-select-btn" onclick="openCustomSelect(event, '附加电源条件', ['不限电源','仅限插电 (AC)','仅限电池 (DC)'], '${cur.powerCond}', v => updateScene('${cur.id}','powerCond',v))">
          <span>${cur.powerCond}</span><span style="color:var(--ink-3)">▾</span>
        </button>
      </div>
    `;
  } else {
    triggerBlock = `<input class="clean-input" value="${cur.targets[0] || ""}" oninput="cur.targets=[this.value]; renderScenariosPage()" />`;
  }

  ed.innerHTML = `
    <div>
      <div class="field-label">
        <span>规则名称与优先级</span>
        <span style="font-weight:400;color:var(--ink-2)">当前 #${idx + 1}</span>
      </div>
      <div style="display:flex;gap:6px">
        <input class="clean-input" value="${cur.name}" oninput="updateScene('${cur.id}','name',this.value,true)" />
        <button class="btn btn-sm" style="height:32px" ${idx===0?"disabled":""} onclick="moveScene(${idx},-1)" title="上移优先级">↑</button>
        <button class="btn btn-sm" style="height:32px" ${idx===scenarios.length-1?"disabled":""} onclick="moveScene(${idx},1)" title="下移优先级">↓</button>
      </div>
    </div>

    <div>
      <div class="field-label">WHEN · 触发源</div>
      <button class="custom-select-btn" style="margin-bottom:8px" onclick="openCustomSelect(event, '选择触发源类型', triggerCats, '${cur.triggerCat}', v => changeTriggerCat('${cur.id}', v))">
        <span>${cur.triggerCat}</span><span style="color:var(--ink-3)">▾</span>
      </button>
      ${triggerBlock}
    </div>

    <div>
      <div class="field-label">THEN · 三域独立动作</div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <button class="custom-select-btn" onclick="openCustomSelect(event, '调校方案', tuningOpts, '${cur.tuning}', v => updateScene('${cur.id}','tuning',v))">
          <span class="muted">调校</span><span>${cur.tuning}</span>
        </button>
        <button class="custom-select-btn" onclick="openCustomSelect(event, '调度方案', schedOpts, '${cur.sched}', v => updateScene('${cur.id}','sched',v))">
          <span class="muted">调度</span><span>${cur.sched}</span>
        </button>
        <button class="custom-select-btn" onclick="openCustomSelect(event, '电源方案', powerOpts, '${cur.power}', v => updateScene('${cur.id}','power',v))">
          <span class="muted">电源</span><span>${cur.power}</span>
        </button>
      </div>
    </div>

    <div class="toggle-row" onclick="updateScene('${cur.id}','exitRestore', ${!cur.exitRestore})">
      <span style="font-size:12px">退出条件时自动恢复原状态</span>
      <button class="switch ${cur.exitRestore ? "on" : ""}"></button>
    </div>
  `;
}

function moveScene(idx, delta) {
  const next = idx + delta;
  if (next < 0 || next >= scenarios.length) return;
  const [item] = scenarios.splice(idx, 1);
  scenarios.splice(next, 0, item);
  renderScenariosPage();
}
function toggleHit(id) { const s = scenarios.find(x => x.id === id); if (s) s.hit = !s.hit; renderScenariosPage(); }
function sToggle(id) { const s = scenarios.find(x => x.id === id); if (s) s.enabled = !s.enabled; renderScenariosPage(); }
function updateScene(id, k, v, skipRender) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  s[k] = v;
  if (!skipRender) renderScenariosPage();
}
function changeTriggerCat(id, cat) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  s.triggerCat = cat;
  if (cat === "进程集合") { s.matchMode = "exeList"; s.targets = ["game.exe"]; }
  else if (cat === "电源状态") s.targets = ["切换至直流电池 (DC)"];
  else if (cat === "温度 / 功耗") s.targets = ["Tctl ≥ 90°C"];
  else if (cat === "空闲 / 锁屏") s.targets = ["无操作 ≥ 10 分钟"];
  else s.targets = ["23:00 – 07:00"];
  renderScenariosPage();
}
function addExe(id) {
  const val = $("newExeInput").value.trim();
  const s = scenarios.find(x => x.id === id);
  if (val && s && !s.targets.includes(val)) { s.targets.push(val); renderScenariosPage(); }
}
function removeExe(id, idx) { const s = scenarios.find(x => x.id === id); if (s) { s.targets.splice(idx, 1); renderScenariosPage(); } }
function openRunningPicker(e, id) {
  e.stopPropagation();
  const s = scenarios.find(x => x.id === id);
  const rect = e.currentTarget.getBoundingClientRect();
  let html = `<div class="pop-head">从正在运行的进程添加</div>`;
  runningSample.forEach(exe => {
    const added = s.targets.includes(exe);
    html += `<button class="pop-item ${added?"active":""}" onclick="toggleExeInScene('${id}','${exe}')"><span>${exe}</span><span>${added?"✓":""}</span></button>`;
  });
  showPopover(rect.left - 80, rect.top - 220, html);
}
function toggleExeInScene(id, exe) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  const idx = s.targets.indexOf(exe);
  if (idx >= 0) s.targets.splice(idx, 1); else s.targets.push(exe);
  closePop(); renderScenariosPage();
}
function addScene() {
  const ns = { id: "s" + Date.now(), enabled: true, hit: false, name: `新规则 ${scenarios.length + 1}`, triggerCat: "进程集合", matchMode: "exeList", targets: ["app.exe"], dirPrefix: "", powerCond: "不限电源", tuning: "保持原样", sched: "保持原样", power: "保持原样", exitRestore: true };
  scenarios.push(ns); selectedSceneId = ns.id; renderScenariosPage();
}
function deleteScene(id) {
  if (scenarios.length <= 1) { toast("至少保留一条示例规则"); return; }
  const idx = scenarios.findIndex(s => s.id === id);
  if (idx >= 0) { scenarios.splice(idx, 1); selectedSceneId = scenarios[0].id; renderScenariosPage(); }
}
function openConflictPop(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  let html = `<div class="pop-head">冲突仲裁策略</div>`;
  ["按域独立 · 高优先级胜出", "按域独立 · 最近触发覆盖", "用户接管优先"].forEach(m => {
    html += `<button class="pop-item ${conflictMode===m?"active":""}" onclick="conflictMode='${m}'; closePop(); renderScenariosPage()">${m}</button>`;
  });
  showPopover(rect.left, rect.bottom + 6, html);
}
function openLedgerFlyout(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  showPopover(rect.left - 240, rect.bottom + 8, `
    <div class="pop-head">StateLedger 状态账本</div>
    <div style="padding:6px 8px;font-size:12px;color:var(--ink-2);line-height:1.5">
      <div><strong>obs64.exe</strong> · 用户接管中</div>
      <div style="margin-top:6px"><strong>PCIe ASPM</strong> · 部分跳过 (Win32 87)</div>
    </div>
  `);
}

renderPage();
</script>
</body>
</html>
