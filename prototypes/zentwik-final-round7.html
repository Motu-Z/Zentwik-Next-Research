<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zentwik · 可扩展首页、方案库、能力诊断与系统设置</title>
<style>
  :root {
    --bg-void: #05070b;
    --bg-surface: #0a0d13;
    --bg-elevated: #111621;
    --bg-glass: rgba(16, 21, 32, 0.92);
    --bg-hover: rgba(255, 255, 255, 0.042);
    --bg-row-alt: rgba(255, 255, 255, 0.014);

    --hairline: rgba(255, 255, 255, 0.055);
    --hairline-strong: rgba(255, 255, 255, 0.14);

    --ink-1: #eef2f8;
    --ink-2: #9aa6ba;
    --ink-3: #56647a;

    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --accent-glow: rgba(59, 130, 246, 0.28);

    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;

    --row-pad-y: 11px;
    --font-size: 13px;
    --mono: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
  }

  [data-theme="light"] {
    --bg-void: #e9edf4;
    --bg-surface: #f8fafd;
    --bg-elevated: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.94);
    --bg-hover: rgba(15, 23, 42, 0.04);
    --bg-row-alt: rgba(15, 23, 42, 0.018);
    --hairline: rgba(15, 23, 42, 0.07);
    --hairline-strong: rgba(15, 23, 42, 0.15);
    --ink-1: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
  }

  [data-density="compact"] { --row-pad-y: 7px; --font-size: 12px; }
  [data-density="relaxed"] { --row-pad-y: 14px; --font-size: 13.5px; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg-void); color: var(--ink-1);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: var(--font-size); line-height: 1.4;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: ""; position: fixed; top: -220px; left: 8%; width: 720px; height: 420px;
    background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 72%);
    opacity: 0.3; pointer-events: none; z-index: 0;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.16); border-radius: 99px; }

  .titlebar {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding-left: 18px; user-select: none; position: relative; z-index: 20;
  }
  .tb-telemetry { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; color: var(--ink-3); }
  .tb-telemetry b { color: var(--ink-2); font-weight: 600; }
  .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.good { background: var(--good); opacity: 0.85; }
  .dot.warn { background: var(--warn); }
  .dot.muted { background: transparent; border: 1.3px solid var(--ink-3); opacity: 0.55; }

  .tb-right { display: flex; align-items: center; height: 100%; }
  .icon-btn, .cap-btn {
    width: 38px; height: 100%; border: none; background: transparent; color: var(--ink-2);
    cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative;
    transition: color .14s, background .14s;
  }
  .cap-btn { width: 44px; }
  .icon-btn:hover, .cap-btn:hover { color: var(--ink-1); background: var(--bg-hover); }
  .cap-btn.close:hover { background: #dc2626; color: #fff; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .cap-btn svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  .mini-dot { position: absolute; top: 9px; right: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }

  .shell { height: calc(100vh - 36px); display: flex; position: relative; z-index: 1; }

  .nav-rail {
    width: 162px; min-width: 162px; padding: 8px 10px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: width .2s cubic-bezier(.22,1,.36,1), min-width .2s cubic-bezier(.22,1,.36,1);
  }
  .nav-rail.collapsed { width: 56px; min-width: 56px; padding: 8px 8px 14px; }
  .brand-toggle {
    width: 100%; border: none; background: transparent; color: var(--ink-1);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 14px;
    border-radius: 9px; cursor: pointer; overflow: hidden; transition: background .14s;
  }
  .brand-toggle:hover { background: var(--bg-hover); }
  .brand-toggle svg { width: 22px; height: 22px; flex-shrink: 0; color: var(--accent); filter: drop-shadow(0 0 10px var(--accent-glow)); }
  .brand-name { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .nav-rail.collapsed .brand-toggle { justify-content: center; padding: 8px 0; }
  .nav-rail.collapsed .brand-name, .nav-rail.collapsed .nav-label { display: none; }

  .nav-btn {
    width: 100%; height: 34px; border: none; background: transparent; color: var(--ink-2);
    border-radius: 8px; padding: 0 10px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-size: var(--font-size);
    transition: background .12s, color .12s; margin-bottom: 3px; position: relative;
  }
  .nav-rail.collapsed .nav-btn { justify-content: center; padding: 0; }
  .nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.65; flex-shrink: 0; }
  .nav-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .nav-btn.active { background: rgba(255, 255, 255, 0.04); color: var(--ink-1); font-weight: 600; }
  .nav-btn.active::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2.5px;
    border-radius: 2px; background: var(--accent);
  }
  .nav-btn.active svg { color: var(--accent); }

  .stage {
    flex: 1; min-width: 0; margin: 0 10px 10px 0;
    background: var(--bg-surface); border: 1px solid var(--hairline); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.48);
  }

  .cmd-header {
    padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 100%);
  }
  .cmd-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .cmd-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .seg-pill {
    display: inline-flex; padding: 2px; border-radius: 999px;
    background: rgba(255,255,255,0.028); border: 1px solid var(--hairline);
  }
  .seg-btn {
    border: none; background: transparent; color: var(--ink-3);
    padding: 4px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all .14s;
  }
  .seg-btn:hover { color: var(--ink-1); }
  .seg-btn.active { background: var(--bg-elevated); color: var(--ink-1); font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }

  .btn {
    height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--hairline-strong); background: rgba(255,255,255,0.02);
    color: var(--ink-1); cursor: pointer; font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn-danger { border-color: rgba(239, 68, 68, 0.35); color: #f87171; background: rgba(239, 68, 68, 0.08); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.18); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink-1); background: var(--bg-hover); }
  .btn-sm { height: 24px; padding: 0 9px; font-size: 11.5px; border-radius: 6px; }

  .stage-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 28px; }
  .group-title { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.5px; padding: 14px 14px 6px; }

  /* Extensible Home Dashboard */
  .telemetry-strip {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    padding: 6px 0 16px;
  }
  .metric-cell {
    padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--hairline);
    display: flex; flex-direction: column; gap: 4px;
  }
  .metric-lbl { font-size: 11px; color: var(--ink-3); }
  .metric-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--ink-1); letter-spacing: -0.5px; }
  .metric-sub { font-size: 11px; color: var(--ink-2); }

  .home-grid {
    display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.9fr); gap: 16px;
    align-items: start;
  }
  .module-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
  }
  .mod-tile {
    padding: 14px 15px; border-radius: 12px;
    background: rgba(255,255,255,0.022); border: 1px solid var(--hairline);
    cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    transition: all .14s;
  }
  .mod-tile:hover { background: var(--bg-hover); border-color: var(--hairline-strong); transform: translateY(-1px); }
  .mod-tile.optional { border-style: dashed; opacity: 0.68; }
  .mod-tile.optional:hover { opacity: 1; }
  .mod-top { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .mod-val { font-family: var(--mono); font-size: 12.5px; color: var(--ink-1); }
  .mod-meta { font-size: 11.5px; color: var(--ink-3); }

  /* Adaptive-Height Timeline Card */
  .timeline-panel {
    border-radius: 12px; border: 1px solid var(--hairline);
    background: rgba(255,255,255,0.016); padding: 14px 16px;
    max-height: 460px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tl-item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; }
  .tl-time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 42px; padding-top: 2px; }
  .tl-body { font-size: 12px; color: var(--ink-2); line-height: 1.45; }
  .tl-body strong { color: var(--ink-1); font-weight: 500; }

  /* List Rows & Inline Diff */
  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: var(--row-pad-y) 14px; border-radius: 10px; transition: background .12s;
  }
  .list-row.clickable { cursor: pointer; }
  .list-row:nth-child(even) { background: var(--bg-row-alt); }
  .list-row:hover { background: var(--bg-hover); }
  .list-row.expanded { background: rgba(255,255,255,0.035); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .row-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-weight: 500; color: var(--ink-1); display: flex; align-items: center; gap: 8px; }
  .row-sub { font-size: 11.5px; color: var(--ink-3); }
  .row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .mono-val { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .diff-badge { font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: rgba(245, 158, 11, 0.14); color: #fbbf24; }

  .inline-diff-drawer {
    margin: 0 0 6px 0; padding: 10px 14px 12px 24px;
    border-radius: 0 0 10px 10px;
    background: rgba(255,255,255,0.022); border-top: 1px solid var(--hairline);
    display: flex; flex-direction: column; gap: 6px;
  }
  .diff-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 10px; border-radius: 7px; font-size: 12px; }
  .diff-line.changed { background: rgba(245, 158, 11, 0.06); }
  .diff-k { color: var(--ink-2); }
  .diff-v { font-family: var(--mono); font-size: 11.5px; }
  .diff-old { color: var(--ink-3); text-decoration: line-through; margin-right: 8px; }
  .diff-new { color: var(--warn); font-weight: 600; }

  /* Settings Sub-Navigation */
  .settings-layout { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .settings-subnav { width: 176px; min-width: 176px; padding: 6px 10px 16px 18px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--hairline); }
  .subnav-btn { width: 100%; border: none; background: transparent; color: var(--ink-2); padding: 8px 11px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 12.5px; font-weight: 500; transition: all .12s; }
  .subnav-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .subnav-btn.active { background: var(--accent-soft); color: var(--ink-1); font-weight: 600; }
  .settings-content { flex: 1; min-width: 0; overflow-y: auto; padding: 4px 22px 28px; }

  .switch {
    width: 32px; height: 18px; border-radius: 999px; border: 1px solid var(--hairline-strong);
    background: rgba(255,255,255,0.06); position: relative; cursor: pointer; transition: all .16s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--ink-2); transition: transform .16s, background .16s;
  }
  .switch.on { background: var(--accent-soft); border-color: var(--accent); }
  .switch.on::after { transform: translateX(14px); background: var(--accent); }

  .swatch-row { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .1s; }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: var(--ink-1); }

  .popover {
    position: fixed; z-index: 80; min-width: 230px;
    background: var(--bg-glass); backdrop-filter: blur(22px);
    border: 1px solid var(--hairline-strong); border-radius: 12px;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.72);
    padding: 8px; display: flex; flex-direction: column; gap: 3px;
  }
  .pop-head { padding: 5px 9px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .pop-item { border: none; background: transparent; color: var(--ink-1); padding: 7px 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  .pop-item:hover { background: var(--bg-hover); }
  .pop-sep { height: 1px; background: var(--hairline); margin: 4px; }

  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-glass); backdrop-filter: blur(14px); color: var(--ink-1);
    border: 1px solid var(--hairline-strong); padding: 8px 16px; border-radius: 999px; font-size: 12px; z-index: 95;
  }
</style>
</head>
<body data-theme="dark" data-density="standard">

<!-- Ultra-Lean Titlebar: 5 Icons on the Right -->
<header class="titlebar">
  <div class="tb-telemetry">
    <span class="dot good"></span>
    <span><b>Ryzen 9 9955HX</b> · 16C/32T · AC · Worker 已连接</span>
  </div>
  <div class="tb-right">
    <button class="icon-btn" title="场景快控" onclick="openSceneFlyout(event)">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </button>
    <button class="icon-btn" title="StateLedger 状态账本" onclick="openLedgerFlyout(event)">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <span class="mini-dot"></span>
    </button>
    <button class="cap-btn" title="最小化"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
    <button class="cap-btn" title="最大化"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
    <button class="cap-btn close" title="关闭"><svg viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
  </div>
</header>

<div class="shell">
  <aside class="nav-rail" id="navRail">
    <div>
      <button class="brand-toggle" onclick="document.getElementById('navRail').classList.toggle('collapsed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/>
          <polyline points="8 10 15 10 9 15 16 15"/>
        </svg>
        <span class="brand-name">Zentwik</span>
      </button>

      <button class="nav-btn active" id="navHome" onclick="switchPage('home')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span class="nav-label">首页总览</span></button>
      <button class="nav-btn" onclick="toast('CPU 调校')"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span class="nav-label">CPU 调校</span></button>
      <button class="nav-btn" onclick="toast('电源管理')"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span class="nav-label">电源管理</span></button>
      <button class="nav-btn" onclick="toast('进程与调度')"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="nav-label">进程与调度</span></button>
      <button class="nav-btn" onclick="toast('场景自动化')"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="nav-label">场景自动化</span></button>
      <button class="nav-btn" id="navPlans" onclick="switchPage('plans')"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label">方案库</span></button>
    </div>
    <div>
      <button class="nav-btn" id="navDiag" onclick="switchPage('diag')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="nav-label">能力与诊断</span></button>
      <button class="nav-btn" id="navSettings" onclick="switchPage('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nav-label">系统设置</span></button>
    </div>
  </aside>

  <div class="stage" id="stageContainer"></div>
</div>

<div class="popover hidden" id="popover"></div>
<div class="toast hidden" id="toastEl"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(msg) {
  const el = $("toastEl"); el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(window._t); window._t = setTimeout(() => el.classList.add("hidden"), 2400);
}
function closePop() { $("popover").classList.add("hidden"); }
document.addEventListener("click", (e) => {
  if (!e.target.closest("#popover") && !e.target.closest(".icon-btn")) closePop();
});
function showPopover(x, y, html) {
  const pop = $("popover"); pop.innerHTML = html; pop.classList.remove("hidden");
  const rect = pop.getBoundingClientRect();

function renderPlansPage() {
  const c = $("stageContainer");
  const list = planData[planDomainTab];
  if (expandedPlanIdx !== null && expandedPlanIdx >= list.length) expandedPlanIdx = 0;

  c.innerHTML = `
    <header class="cmd-header">
      <div class="cmd-left">
        <span class="page-title">方案库</span>
        <div class="seg-pill">
          <button class="seg-btn ${planDomainTab==="tuning"?"active":""}" onclick="planDomainTab='tuning';expandedPlanIdx=0;renderPlansPage()">调校方案</button>
          <button class="seg-btn ${planDomainTab==="sched"?"active":""}" onclick="planDomainTab='sched';expandedPlanIdx=0;renderPlansPage()">调度方案</button>
          <button class="seg-btn ${planDomainTab==="power"?"active":""}" onclick="planDomainTab='power';expandedPlanIdx=0;renderPlansPage()">电源方案</button>
        </div>
      </div>
    </header>
    <div class="stage-body" id="plansBody"></div>
  `;

  const body = $("plansBody");
  list.forEach((it, idx) => {
    const isExp = expandedPlanIdx === idx;
    const changedCount = it.diffs.filter(d => d.changed).length;

    const row = document.createElement("div");
    row.className = `list-row clickable ${isExp ? "expanded" : ""}`;
    row.onclick = () => { expandedPlanIdx = isExp ? null : idx; renderPlansPage(); };
    row.innerHTML = `
      <div class="row-main">
        <div class="row-title">
          <span>${it.name}</span>
          ${it.active ? `<span class="dot good"></span>` : ""}
          ${it.dirty ? `<span class="diff-badge">${changedCount} 项未存</span>` : ""}
        </div>
        <div class="row-sub">${it.summary}</div>
      </div>
      <div class="row-right">
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();toast('重命名「${it.name}」')">重命名</button>
        <button class="btn btn-sm ${it.active?"btn-ghost":"btn-primary"}" onclick="event.stopPropagation();activatePlan('${planDomainTab}',${idx})">${it.active?"已生效":"应用"}</button>
      </div>
    `;
    body.appendChild(row);

    if (isExp) {
      const drawer = document.createElement("div");
      drawer.className = "inline-diff-drawer";
      drawer.innerHTML = `
        ${it.diffs.map(d => `
          <div class="diff-line ${d.changed ? "changed" : ""}">
            <span class="diff-k">${d.k}</span>
            <span class="diff-v">
              ${d.changed ? `<span class="diff-old">${d.saved}</span><span class="diff-new">${d.live}</span>` : `<span style="color:var(--ink-2)">${d.saved}</span>`}
            </span>
          </div>
        `).join("")}
        ${it.dirty ? `
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
            <button class="btn btn-sm" onclick="discardPlanDiff(${idx})">放弃改动</button>
            <button class="btn btn-sm btn-primary" onclick="savePlanDiff(${idx})">覆盖保存</button>
          </div>
        ` : ""}
      `;
      body.appendChild(drawer);
    }
  });
}

function activatePlan(dom, idx) { planData[dom].forEach((p, i) => p.active = (i === idx)); toast(`已应用「${planData[dom][idx].name}」`); renderPlansPage(); }
function savePlanDiff(idx) { const cur = planData[planDomainTab][idx]; cur.diffs.forEach(d => { d.saved = d.live; d.changed = false; }); cur.dirty = false; toast(`已覆盖保存「${cur.name}」`); renderPlansPage(); }
function discardPlanDiff(idx) { const cur = planData[planDomainTab][idx]; cur.diffs.forEach(d => { d.live = d.saved; d.changed = false; }); cur.dirty = false; toast(`已放弃改动`); renderPlansPage(); }

  document.documentElement.style.setProperty("--accent", hex);
  document.documentElement.style.setProperty("--accent-soft", hex + "26");
  document.documentElement.style.setProperty("--accent-glow", hex + "44");
  renderSettingsPage();
}

function openSceneFlyout(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  showPopover(rect.left - 180, rect.bottom + 6, `
    <div class="pop-head">场景快控</div>
    <button class="pop-item" onclick="closePop()"><span>大型游戏</span><span>●</span></button>
    <button class="pop-item" onclick="closePop()"><span>创作与编译</span></button>
    <button class="pop-item" onclick="closePop()"><span>离线续航</span></button>
  `);
}

function openLedgerFlyout(e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  showPopover(rect.left - 220, rect.bottom + 6, `
    <div class="pop-head">StateLedger 状态账本</div>
    <div style="padding:6px 10px;font-size:12px;color:var(--ink-2);line-height:1.5">
      <div><strong>obs64.exe</strong> · 用户接管中</div>
      <div style="font-size:11px;color:var(--ink-3)">Desired: CCD1 · Actual: 系统默认</div>
    </div>
    <div class="pop-sep"></div>
    <button class="pop-item" onclick="closePop(); toast('已释放用户接管')"><span>释放全部接管</span></button>
  `);
}

renderPage();
</script>
